# Security headers for the explorer vhosts (issue #59).
#
# Deployed to /etc/nginx/snippets/explorer-security.conf and included from
# EVERY location block as well as the server block. nginx's add_header does
# not inherit into a location that sets any add_header of its own, so the
# cache-control locations would otherwise silently lose all of these.
#
# netlify.toml declares a similar set, but Netlify only serves beta —
# production is nginx, so until this file existed the live site sent no
# security headers at all.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "clipboard-read=(self), clipboard-write=(self)" always;

# Content Security Policy.
#
# Report-Only while the policy is validated against the wallet flows, which
# cannot be exercised headlessly. Promote to Content-Security-Policy once the
# console shows no violations for connect, sign and the account/transaction
# pages.
#
# Notes on the allowances:
#   script-src  'wasm-unsafe-eval' — factom, the SDK and the preload chunk
#               instantiate WebAssembly. No eval or new Function anywhere in
#               the bundle, so 'unsafe-eval' is deliberately absent.
#   style-src   'unsafe-inline' — antd is CSS-in-JS and injects style tags.
#               fonts.googleapis.com is the @import at the top of App.css.
#   connect-src every configured network API, the metrics service, the
#               accumulated.finance LSD API used by the staking page, the
#               GitLab error-tracking DSN, and the WalletConnect relays.
#   img-src     https: — wallet and token artwork comes from many origins.
#
# The script-src hash covers the inline theme script in index.html, which has
# to run before paint to avoid flashing the wrong theme. **If that script is
# edited the hash must be regenerated**, or the theme will flash and the
# console will report a violation:
#
#   curl -s https://explorer.accumulatenetwork.io/ |
#     python3 -c "import re,sys,hashlib,base64; b=re.search(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',sys.stdin.read(),re.S).group(1); print('sha256-'+base64.b64encode(hashlib.sha256(b.encode()).digest()).decode())"
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-6CZwq42cvR0aV2wYpMRe4UB7Qs5yMMG4nadQIsK0oOA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com; connect-src 'self' https://mainnet.accumulatenetwork.io https://staking.accumulatenetwork.io https://api-gateway.accumulate.defidevs.io https://kermit.accumulatenetwork.io https://testnet.accumulatenetwork.io https://fozzie.accumulatenetwork.io https://metrics.accumulatenetwork.io https://api.accumulated.finance https://observe.gitlab.com https://*.walletconnect.com https://*.walletconnect.org https://*.web3modal.org https://*.reown.com wss://*.walletconnect.com wss://*.walletconnect.org wss://*.reown.com" always;
