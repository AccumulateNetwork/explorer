stages:
  - build
  - deploy

variables:
  VITE_NETWORK: any

# `npm ci` installs exactly what package-lock.json records and fails if the
# lockfile and package.json disagree. `yarn install` re-resolved the tree on
# every run, so CI could build against dependencies nobody had tested.
# Cache ~/.npm rather than node_modules, which `npm ci` deletes.
.node:
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

# Typecheck job (runs on all branches)
typecheck:
  extends: .node
  stage: build
  script:
    - npm run check

# Formatting (runs on all branches)
format:
  extends: .node
  stage: build
  script:
    - npm run check:format

# Lint (runs on all branches). Fails on errors only: the codebase carries
# ~200 warnings (mostly `any` and unused vars), which are the floor to work
# down rather than a gate nobody can pass. See #65.
lint:
  extends: .node
  stage: build
  script:
    - npm run lint

# Unit tests (runs on all branches)
test:
  extends: .node
  stage: build
  script:
    - npm test

# Build job (runs on all branches)
build:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

# GitLab Pages (for GitLab's built-in pages feature)
pages:
  stage: deploy
  image: node:20
  script:
    - mkdir -p public
    - cp -r build/* public/
  artifacts:
    paths:
      - public
  only:
    - main

# Deploy to Netlify beta (on develop branch)
deploy_beta:
  stage: deploy
  image: node:20
  before_script:
    - npm install -g netlify-cli
  script:
    - echo "Deploying to beta.explorer.accumulatenetwork.io (Netlify)..."
    - netlify deploy --prod --site=${NETLIFY_BETA_SITE_ID} --auth=${NETLIFY_AUTH_TOKEN} --dir=build
    - echo "✓ Beta deployment complete"
  environment:
    name: beta
    url: https://beta.explorer.accumulatenetwork.io
  only:
    - develop
  dependencies:
    - build

# Deploy to Netlify production (on main branch, manual trigger)
deploy_production:
  stage: deploy
  image: node:20
  before_script:
    - npm install -g netlify-cli
  script:
    - echo "Deploying to explorer.accumulatenetwork.io (Netlify)..."
    - netlify deploy --prod --site=${NETLIFY_PROD_SITE_ID} --auth=${NETLIFY_AUTH_TOKEN} --dir=build
    - echo "✓ Production deployment complete"
  environment:
    name: production
    url: https://explorer.accumulatenetwork.io
  only:
    - main
  when: manual # Require manual trigger for production safety
  dependencies:
    - build
