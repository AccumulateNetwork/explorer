stages:
  - build

variables:
  VITE_NETWORK: any

# `npm ci` installs exactly what package-lock.json records and fails if the
# lockfile and package.json disagree. `yarn install` re-resolved the tree on
# every run, so CI could build against dependencies nobody had tested.
# Cache ~/.npm rather than node_modules, which `npm ci` deletes.
.node:
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

# Typecheck job (runs on all branches)
typecheck:
  extends: .node
  stage: build
  script:
    - npm run check

# Formatting (runs on all branches)
format:
  extends: .node
  stage: build
  script:
    - npm run check:format

# Lint (runs on all branches). Fails on errors only: the codebase carries
# ~200 warnings (mostly `any` and unused vars), which are the floor to work
# down rather than a gate nobody can pass. See #65.
lint:
  extends: .node
  stage: build
  script:
    - npm run lint

# Unit tests (runs on all branches)
test:
  extends: .node
  stage: build
  script:
    - npm test

# Build job (runs on all branches)
build:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

# No deploy jobs. Production is nginx on server1, deployed by hand from a
# release build (DEPLOYMENT.md); nothing here can deploy it, and a job named
# deploy_production that targets something else is how production once went
# three months stale. The Netlify jobs (beta, decommissioned ~2026-03) failed
# every develop pipeline for want of a token, and the Pages job published
# from `main`, which does not exist (#94).
